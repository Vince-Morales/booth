<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Booth</title>

<!-- iOS "add to home screen" app behavior -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Booth" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#171412" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg:#171412;
    --panel:#221e1b;
    --panel-2:#2b2622;
    --ink:#ede6dc;
    --ink-dim:#a79e93;
    --amber:#d9a441;
    --brick:#b23a2e;
    --line:#3a332c;
    --focus:#7fb8ff;
    --sat:env(safe-area-inset-top, 0px);
    --sar:env(safe-area-inset-right, 0px);
    --sab:env(safe-area-inset-bottom, 0px);
    --sal:env(safe-area-inset-left, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0;
    height:100%;
    overscroll-behavior:none;
  }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk', system-ui, sans-serif;
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  button{font-family:inherit; border:none; background:none; color:inherit;}
  input{font-family:inherit;}
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:2px;
  }

  .app{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
    padding-top:var(--sat);
    padding-left:var(--sal);
    padding-right:var(--sar);
  }

  /* ---------------- shared bits ---------------- */
  .icon-btn{
    width:44px; height:44px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
  }
  .icon-btn:active{background:rgba(255,255,255,.16);}

  /* ================= CAMERA VIEW ================= */
  .view-camera{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .cam-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 14px;
    gap:10px;
  }
  .brand-chip{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.06);
    border-radius:999px;
    padding:6px 14px 6px 8px;
  }
  .brand-chip .wordmark{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:17px;
  }
  .brand-chip .edit-glyph{font-size:12px; color:var(--ink-dim);}
  .status-dot-wrap{
    display:flex; align-items:center; gap:6px;
    font-size:11px; color:var(--ink-dim);
    font-family:'JetBrains Mono', monospace;
  }
  .timer-toggle{
    display:flex; align-items:center; gap:6px;
    background:rgba(255,255,255,.08);
    border-radius:999px;
    padding:8px 13px;
    font-size:12px;
    font-weight:600;
    color:var(--ink-dim);
    flex:0 0 auto;
  }
  .timer-toggle:active{background:rgba(255,255,255,.16);}
  .timer-toggle.on{color:var(--amber);}
  .timer-toggle.off{opacity:.55;}
  .timer-toggle.off #timerToggleIcon{opacity:.6;}
  .status-dot{width:7px; height:7px; border-radius:50%; background:#6a6259;}
  .status-dot.live{background:#5fd07a;}

  .cam-stage{
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6px 14px;
  }
  .camera-wrap{
    position:relative;
    width:100%;
    max-height:100%;
    aspect-ratio:3/4;
    background:#0c0a09;
    border-radius:18px;
    overflow:hidden;
    margin:auto;
  }
  video{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  video.mirror{transform:scaleX(-1);}

  .camera-empty, .camera-error{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:24px;
    color:var(--ink-dim);
  }
  .camera-error{background:rgba(12,10,9,.94); display:none;}
  .camera-empty p, .camera-error p{margin:0; font-size:13.5px; max-width:30ch; line-height:1.5;}

  .flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none;}
  .flash.go{animation:flashfade .35s ease-out;}
  @keyframes flashfade{0%{opacity:.9;} 100%{opacity:0;}}

  .countdown{position:absolute; inset:0; display:none; align-items:center; justify-content:center; pointer-events:none;}
  .countdown span{
    font-family:'Baloo 2', sans-serif; font-weight:800;
    font-size:min(28vw, 130px); color:#fff;
    text-shadow:0 0 30px rgba(0,0,0,.55);
    animation:pop .5s ease;
  }
  @keyframes pop{from{transform:scale(.6); opacity:0;} to{transform:scale(1); opacity:1;}}

  .pose-msg{
    position:absolute; left:0; right:0; bottom:0;
    padding:10px 14px;
    background:linear-gradient(transparent, rgba(0,0,0,.65));
    font-size:13px; color:#fff; text-align:center; font-weight:500;
  }
  .shot-dots{position:absolute; top:12px; right:12px; display:none; gap:6px;}
  .shot-dots i{width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.28); display:block;}
  .shot-dots i.filled{background:#fff;}

  .filters{
    display:flex; gap:8px; overflow-x:auto;
    padding:10px 14px 4px;
    -webkit-overflow-scrolling:touch;
  }
  .filters::-webkit-scrollbar{display:none;}
  .filter-chip{
    flex:0 0 auto;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--ink-dim);
    padding:7px 14px;
    border-radius:999px;
    font-size:12.5px;
    white-space:nowrap;
  }
  .filter-chip.active{color:var(--bg); background:var(--amber); border-color:var(--amber); font-weight:600;}

  .cam-bottombar{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 22px calc(16px + var(--sab));
  }
  .shutter-wrap{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .shutter{
    width:74px; height:74px;
    border-radius:50%;
    background:#fff;
    border:4px solid rgba(255,255,255,.35);
    padding:4px;
  }
  .shutter::after{
    content:'';
    display:block;
    width:100%; height:100%;
    border-radius:50%;
    background:var(--brick);
  }
  .shutter:disabled{opacity:.4;}
  .shutter-label{font-size:11px; color:var(--ink-dim); font-family:'JetBrains Mono', monospace;}

  .review-jump{
    width:52px; height:52px;
    border-radius:12px;
    background:var(--panel-2);
    border:1px solid var(--line);
    background-size:cover;
    background-position:center;
    position:relative;
  }
  .review-jump span{
    position:absolute; bottom:2px; right:4px;
    font-size:9px; font-family:'JetBrains Mono', monospace;
    color:rgba(255,255,255,.8);
  }

  /* ================= REVIEW VIEW ================= */
  .view-review{
    flex:1;
    display:none;
    flex-direction:column;
    min-height:0;
  }
  body.mode-review .view-review{display:flex;}
  body.mode-review .view-camera{display:none;}

  .review-topbar{
    display:flex; align-items:center; gap:12px;
    padding:10px 14px;
  }
  .review-topbar h2{font-size:14px; margin:0; font-weight:600; color:var(--ink-dim);}

  .strip-scroll{
    flex:1; min-height:0;
    overflow:auto;
    display:flex; justify-content:center;
    padding:8px 14px;
  }
  #stripCanvas{max-width:100%; height:auto; border-radius:10px; display:block;}

  .frame-list{display:flex; gap:8px; padding:8px 14px; justify-content:center;}
  .frame-thumb{
    width:46px; height:60px; border-radius:6px;
    border:1px solid var(--line);
    background:var(--panel-2);
    background-size:cover; background-position:center;
    position:relative;
  }
  .frame-thumb span{
    position:absolute; bottom:2px; right:4px;
    font-size:9px; font-family:'JetBrains Mono', monospace;
    color:rgba(255,255,255,.75);
  }

  .review-hint{
    text-align:center; font-size:11.5px; color:var(--ink-dim);
    padding:0 20px 4px;
  }

  .review-bottombar{
    display:flex; flex-direction:column; gap:10px;
    padding:10px 18px calc(16px + var(--sab));
  }
  .btn{
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--ink);
    padding:14px 18px;
    border-radius:14px;
    font-size:15px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn.primary{background:var(--amber); border-color:var(--amber); color:#171412;}
  .btn.ghost{background:transparent; color:var(--ink-dim); font-weight:500; padding:8px;}
  .btn:active{transform:scale(.98);}
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn{flex:1;}
  .share-note{text-align:center; font-size:11px; color:var(--ink-dim); margin:-2px 0 2px;}

  /* ================= EDIT SHEET ================= */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    display:none; align-items:flex-end; justify-content:center;
    z-index:20;
  }
  body.sheet-open .sheet-backdrop{display:flex;}
  .sheet{
    width:100%; max-width:520px;
    background:var(--panel);
    border-radius:20px 20px 0 0;
    padding:18px 18px calc(18px + var(--sab));
  }
  .sheet h3{margin:0 0 14px; font-size:14px; color:var(--ink-dim); font-weight:600;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11.5px; color:var(--ink-dim); margin-bottom:6px;}
  .field input{
    width:100%; background:var(--panel-2); border:1px solid var(--line);
    color:var(--ink); padding:12px; border-radius:10px; font-size:15px;
  }
  .sheet .btn{margin-top:4px;}

  /* ================= PRINT ================= */
  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{
      display:flex; position:fixed; inset:0;
      align-items:center; justify-content:center;
    }
    #printImg{max-width:100%; max-height:100%;}
  }
</style>
</head>
<body class="mode-camera">

<div class="app">

  <!-- ================= CAMERA VIEW ================= -->
  <div class="view-camera">
    <div class="cam-topbar">
      <button class="brand-chip" id="brandChipBtn" type="button">
        <span class="wordmark" id="wordmarkPreview">chani._.wu</span>
        <span class="edit-glyph">edit ✎</span>
      </button>
      <button class="timer-toggle on" id="timerToggleBtn" type="button" aria-pressed="true">
        <span id="timerToggleIcon">⏱</span><span id="timerToggleLabel">3s</span>
      </button>

      <div class="status-dot-wrap">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">camera off</span>
      </div>
    </div>

    <div class="cam-stage">
      <div class="camera-wrap" id="cameraWrap">
        <video id="video" autoplay playsinline muted class="mirror"></video>

        <div class="camera-empty" id="cameraEmpty">
          <p>Turn on the camera to start a 4-shot session.</p>
          <button class="btn primary" id="enableCamBtn" type="button">Turn on camera</button>
        </div>

        <div class="camera-error" id="cameraError">
          <p id="cameraErrorText">Camera access was blocked. Check your browser's site settings to allow camera access, then reload.</p>
          <button class="btn" id="retryCamBtn" type="button">Try again</button>
        </div>

        <div class="flash" id="flash"></div>
        <div class="countdown" id="countdown"><span id="countdownNum">3</span></div>
        <div class="shot-dots" id="shotDots"><i></i><i></i><i></i><i></i></div>
        <div class="pose-msg" id="poseMsg" style="display:none;"></div>

        <button class="icon-btn" id="flipCamBtn" type="button" style="position:absolute; top:10px; right:10px; display:none;">⟳</button>
      </div>
    </div>

    <div class="filters" id="filters"></div>

    <div class="cam-bottombar">
      <button class="review-jump" id="reviewJumpBtn" type="button" style="visibility:hidden;"><span id="reviewJumpCount">0/4</span></button>

      <div class="shutter-wrap">
        <button class="shutter" id="shutterBtn" type="button" disabled></button>
        <span class="shutter-label" id="shutterLabel">turn on camera</span>
      </div>

      <div style="width:52px;"></div>
    </div>
  </div>

  <!-- ================= REVIEW VIEW ================= -->
  <div class="view-review">
    <div class="review-topbar">
      <button class="icon-btn" id="backToCamBtn" type="button">←</button>
      <h2>your strip</h2>
    </div>

    <div class="strip-scroll">
      <canvas id="stripCanvas" width="620" height="1180"></canvas>
    </div>

    <div class="frame-list" id="frameList">
      <div class="frame-thumb" data-i="0"><span>1</span></div>
      <div class="frame-thumb" data-i="1"><span>2</span></div>
      <div class="frame-thumb" data-i="2"><span>3</span></div>
      <div class="frame-thumb" data-i="3"><span>4</span></div>
    </div>
    <p class="review-hint">Tap a frame to retake just that shot.</p>

    <div class="review-bottombar">
      <p class="share-note" id="shareNote">Share opens your device's share sheet.</p>
      <div class="btn-row">
        <button class="btn primary" id="shareBtn" type="button">⬆︎ Share</button>
        <button class="btn" id="printBtn" type="button">🖨 Print</button>
      </div>
      <button class="btn ghost" id="newSessionBtn" type="button">Start a new session</button>
    </div>
  </div>

</div>

<!-- ================= EDIT SHEET ================= -->
<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet">
    <h3>strip text</h3>
    <div class="field">
      <label for="brandInput">Wordmark (top of strip)</label>
      <input id="brandInput" type="text" maxlength="16" value="chani._.wu" />
    </div>
    <div class="field">
      <label for="captionInput">Caption (bottom of strip)</label>
      <input id="captionInput" type="text" maxlength="40" value="specialty coffee + matcha" />
    </div>
    <button class="btn primary" id="sheetDoneBtn" type="button">Done</button>
  </div>
</div>

<!-- ================= PRINT AREA ================= -->
<div id="printArea"><img id="printImg" alt="" /></div>

<script>
(function(){

  /* ================= config ================= */
  var FILTERS = [
    { id:'none',    label:'No filter', css:'none',                                              canvas:'none' },
    { id:'noir',    label:'Noir',      css:'grayscale(1) contrast(1.15)',                        canvas:'grayscale(1) contrast(1.15)' },
    { id:'sepia',   label:'Sepia',     css:'sepia(.75) contrast(1.05)',                           canvas:'sepia(.75) contrast(1.05)' },
    { id:'vintage', label:'Vintage',   css:'sepia(.35) saturate(1.3) contrast(1.05) brightness(1.03)', canvas:'sepia(.35) saturate(1.3) contrast(1.05) brightness(1.03)', vignette:true },
    { id:'cool',    label:'Cool',      css:'hue-rotate(180deg) saturate(1.1)',                    canvas:'hue-rotate(180deg) saturate(1.1)' },
    { id:'vivid',   label:'Vivid',     css:'saturate(1.55) contrast(1.15)',                       canvas:'saturate(1.55) contrast(1.15)' }
  ];
  var FRAME_LABELS = ['29', '29A', '30A', '31'];
  var LETTER_COLORS = ['#4e8cff', '#e85d3d', '#f2b705', '#3eaf60', '#b23a2e'];

  var FRAME_W = 460, GUTTER = 14, MARGIN = 60, LABEL_W = 46;
  var HEADER_H = 130, FOOTER_H = 110;
  var STRIP_W = MARGIN * 2 + LABEL_W + FRAME_W;

  /* camera aspect ratio starts at a sane default, gets corrected to the
     real device stream as soon as we know it — this is what stops any
     stretch/crop mismatch between preview and the saved strip. */
  var camAspect = 3 / 4; // width / height
  var FRAME_H = Math.round(FRAME_W / camAspect);
  var STRIP_H = HEADER_H + (FRAME_H + GUTTER) * 4 + FOOTER_H;

  /* ================= state ================= */
  var state = {
    activeFilter: 'none',
    stream: null,
    facingMode: 'user',
    shots: [null, null, null, null],
    sessionRunning: false,
    retakeIndex: null,
    timerEnabled: true
  };

  /* ================= elements ================= */
  var video = document.getElementById('video');
  var cameraWrap = document.getElementById('cameraWrap');
  var cameraEmpty = document.getElementById('cameraEmpty');
  var cameraError = document.getElementById('cameraError');
  var cameraErrorText = document.getElementById('cameraErrorText');
  var enableCamBtn = document.getElementById('enableCamBtn');
  var retryCamBtn = document.getElementById('retryCamBtn');
  var flipCamBtn = document.getElementById('flipCamBtn');
  var statusDot = document.getElementById('statusDot');
  var statusText = document.getElementById('statusText');
  var timerToggleBtn = document.getElementById('timerToggleBtn');
  var timerToggleLabel = document.getElementById('timerToggleLabel');
  var filtersEl = document.getElementById('filters');
  var shutterBtn = document.getElementById('shutterBtn');
  var shutterLabel = document.getElementById('shutterLabel');
  var reviewJumpBtn = document.getElementById('reviewJumpBtn');
  var reviewJumpCount = document.getElementById('reviewJumpCount');
  var brandChipBtn = document.getElementById('brandChipBtn');
  var wordmarkPreview = document.getElementById('wordmarkPreview');
  var brandInput = document.getElementById('brandInput');
  var captionInput = document.getElementById('captionInput');
  var sheetBackdrop = document.getElementById('sheetBackdrop');
  var sheetDoneBtn = document.getElementById('sheetDoneBtn');
  var stripCanvas = document.getElementById('stripCanvas');
  var stripCtx = stripCanvas.getContext('2d');
  var frameList = document.getElementById('frameList');
  var backToCamBtn = document.getElementById('backToCamBtn');
  var shareBtn = document.getElementById('shareBtn');
  var printBtn = document.getElementById('printBtn');
  var newSessionBtn = document.getElementById('newSessionBtn');
  var flashEl = document.getElementById('flash');
  var countdownEl = document.getElementById('countdown');
  var countdownNum = document.getElementById('countdownNum');
  var shotDots = document.getElementById('shotDots');
  var poseMsg = document.getElementById('poseMsg');
  var printImg = document.getElementById('printImg');
  var shareNote = document.getElementById('shareNote');

  stripCanvas.width = STRIP_W;
  stripCanvas.height = STRIP_H;

  /* ================= filter chips ================= */
  FILTERS.forEach(function(f){
    var chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'filter-chip' + (f.id === state.activeFilter ? ' active' : '');
    chip.textContent = f.label;
    chip.addEventListener('click', function(){
      state.activeFilter = f.id;
      video.style.filter = f.css === 'none' ? '' : f.css;
      Array.prototype.forEach.call(filtersEl.children, function(c){ c.classList.remove('active'); });
      chip.classList.add('active');
    });
    filtersEl.appendChild(chip);
  });

  /* ================= timer toggle ================= */
  function updateTimerToggle(){
    timerToggleBtn.classList.toggle('on', state.timerEnabled);
    timerToggleBtn.classList.toggle('off', !state.timerEnabled);
    timerToggleLabel.textContent = state.timerEnabled ? '3s' : 'off';
    timerToggleBtn.setAttribute('aria-pressed', state.timerEnabled ? 'true' : 'false');
  }
  timerToggleBtn.addEventListener('click', function(){
    state.timerEnabled = !state.timerEnabled;
    updateTimerToggle();
  });
  updateTimerToggle();

  /* ================= camera ================= */
  function stopStream(){
    if (state.stream){
      state.stream.getTracks().forEach(function(t){ t.stop(); });
      state.stream = null;
    }
  }

  function startCamera(){
    cameraError.style.display = 'none';
    if (window.isSecureContext === false){
      showCameraError('Camera access needs a secure page (https://) to work. Opening this file directly on your phone (file://) blocks it before Chrome can even ask for permission — host this file online (e.g. GitHub Pages, Netlify Drop, or Vercel) and open it from that https:// link instead.');
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      showCameraError('This browser does not support camera capture. Try a recent version of Chrome or Safari, and make sure the page is loaded over https://.');
      return;
    }
    stopStream();
    var constraints = {
      video:{
        facingMode: state.facingMode,
        width:{ ideal: 1170 },
        height:{ ideal: 1560 }
      },
      audio:false
    };
    navigator.mediaDevices.getUserMedia(constraints)
      .then(function(stream){
        state.stream = stream;
        video.srcObject = stream;
        video.classList.toggle('mirror', state.facingMode === 'user');
        cameraEmpty.style.display = 'none';
        statusDot.classList.add('live');
        statusText.textContent = 'camera live';
        shutterBtn.disabled = false;
        shutterLabel.textContent = 'tap to start';
        flipCamBtn.style.display = 'flex';
      })
      .catch(function(err){
        var msg = 'Camera access was blocked. Check your browser\'s site settings to allow camera access, then reload.';
        if (err && err.name === 'NotFoundError') msg = 'No camera was found on this device.';
        if (err && err.name === 'NotAllowedError') msg = 'Camera permission was denied. Click the camera icon in your browser\'s address bar (or check Settings) to allow access, then reload.';
        if (err && err.name === 'OverconstrainedError'){
          // retry once without exact ideal sizes
          return navigator.mediaDevices.getUserMedia({ video:{ facingMode: state.facingMode }, audio:false })
            .then(function(stream){
              state.stream = stream;
              video.srcObject = stream;
              video.classList.toggle('mirror', state.facingMode === 'user');
              cameraEmpty.style.display = 'none';
              statusDot.classList.add('live');
              statusText.textContent = 'camera live';
              shutterBtn.disabled = false;
              shutterLabel.textContent = 'tap to start';
              flipCamBtn.style.display = 'flex';
            })
            .catch(function(){ showCameraError(msg); });
        }
        showCameraError(msg);
      });
  }

  function showCameraError(msg){
    cameraErrorText.textContent = msg;
    cameraError.style.display = 'flex';
    cameraEmpty.style.display = 'none';
    statusDot.classList.remove('live');
    statusText.textContent = 'camera unavailable';
  }

  /* the fix for "camera does not stretch": once we know the real stream
     dimensions, match the preview box AND the saved-strip frame size to
     that exact ratio, so cropping/cover math never distorts proportions */
  video.addEventListener('loadedmetadata', function(){
    if (!video.videoWidth || !video.videoHeight) return;
    var ratio = video.videoWidth / video.videoHeight;
    ratio = Math.max(0.45, Math.min(1.4, ratio)); // guard against odd reports
    camAspect = ratio;
    cameraWrap.style.aspectRatio = ratio.toFixed(4) + ' / 1';
    FRAME_H = Math.round(FRAME_W / camAspect);
    STRIP_H = HEADER_H + (FRAME_H + GUTTER) * 4 + FOOTER_H;
    stripCanvas.width = STRIP_W;
    stripCanvas.height = STRIP_H;
    drawStrip();
  });

  enableCamBtn.addEventListener('click', startCamera);
  retryCamBtn.addEventListener('click', startCamera);
  flipCamBtn.addEventListener('click', function(){
    state.facingMode = state.facingMode === 'user' ? 'environment' : 'user';
    startCamera();
  });

  /* ================= capture flow ================= */
  function wait(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }

  function runCountdown(seconds){
    if (!state.timerEnabled){
      countdownEl.style.display = 'none';
      return wait(150);
    }
    countdownEl.style.display = 'flex';
    var n = seconds;
    countdownNum.textContent = n;
    return new Promise(function(resolve){
      var iv = setInterval(function(){
        n -= 1;
        if (n <= 0){
          clearInterval(iv);
          countdownEl.style.display = 'none';
          resolve();
        } else {
          countdownNum.textContent = n;
          countdownNum.style.animation = 'none';
          void countdownNum.offsetWidth;
          countdownNum.style.animation = '';
        }
      }, 1000);
    });
  }

  function flash(){
    flashEl.classList.remove('go');
    void flashEl.offsetWidth;
    flashEl.classList.add('go');
  }

  function captureFrame(){
    var off = document.createElement('canvas');
    off.width = FRAME_W * 2;
    off.height = FRAME_H * 2;
    var octx = off.getContext('2d');
    var f = FILTERS.filter(function(x){ return x.id === state.activeFilter; })[0];
    octx.filter = f.canvas === 'none' ? 'none' : f.canvas;

    var vw = video.videoWidth, vh = video.videoHeight;
    var targetRatio = off.width / off.height;
    var srcRatio = vw / vh;
    var sx, sy, sw, sh;
    if (srcRatio > targetRatio){
      sh = vh; sw = vh * targetRatio; sx = (vw - sw) / 2; sy = 0;
    } else {
      sw = vw; sh = vw / targetRatio; sx = 0; sy = (vh - sh) / 2;
    }

    octx.save();
    if (state.facingMode === 'user'){
      octx.translate(off.width, 0);
      octx.scale(-1, 1);
    }
    octx.drawImage(video, sx, sy, sw, sh, 0, 0, off.width, off.height);
    octx.restore();

    if (f.vignette){
      octx.filter = 'none';
      var g = octx.createRadialGradient(off.width/2, off.height/2, off.height*0.35, off.width/2, off.height/2, off.height*0.75);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,.28)');
      octx.fillStyle = g;
      octx.fillRect(0, 0, off.width, off.height);
    }

    var img = new Image();
    img.src = off.toDataURL('image/jpeg', 0.92);
    return img;
  }

  function setShot(index, img){
    state.shots[index] = { img: img };
    var thumb = frameList.children[index];
    thumb.style.backgroundImage = 'url(' + img.src + ')';
    img.onload = drawStrip;
    if (img.complete) drawStrip();
    updateReviewJump();
  }

  function shotCount(){
    return state.shots.filter(function(s){ return s !== null; }).length;
  }

  function updateReviewJump(){
    var n = shotCount();
    reviewJumpCount.textContent = n + '/4';
    reviewJumpBtn.style.visibility = n > 0 ? 'visible' : 'hidden';
    if (state.shots[0]) reviewJumpBtn.style.backgroundImage = 'url(' + state.shots[0].img.src + ')';
  }

  function updateDots(activeIndex){
    Array.prototype.forEach.call(shotDots.children, function(dot, i){
      dot.classList.toggle('filled', i <= activeIndex);
    });
  }

  function runSession(){
    if (state.sessionRunning || !state.stream) return;
    state.sessionRunning = true;
    shutterBtn.disabled = true;
    shotDots.style.display = 'flex';
    poseMsg.style.display = 'block';
    updateDots(-1);

    var sequence = Promise.resolve();
    for (var i = 0; i < 4; i++){
      (function(i){
        sequence = sequence.then(function(){
          poseMsg.textContent = 'Shot ' + (i + 1) + ' of 4 — strike a pose';
          return runCountdown(3);
        }).then(function(){
          flash();
          setShot(i, captureFrame());
          updateDots(i);
          return wait(900);
        });
      })(i);
    }
    sequence.then(function(){
      state.sessionRunning = false;
      shutterBtn.disabled = false;
      shotDots.style.display = 'none';
      poseMsg.style.display = 'none';
      goToReview();
    });
  }

  shutterBtn.addEventListener('click', function(){
    if (state.retakeIndex !== null){
      var idx = state.retakeIndex;
      poseMsg.style.display = 'block';
      poseMsg.textContent = 'Retaking shot ' + (idx + 1) + '…';
      shutterBtn.disabled = true;
      runCountdown(3).then(function(){
        flash();
        setShot(idx, captureFrame());
        poseMsg.style.display = 'none';
        shutterBtn.disabled = false;
        state.retakeIndex = null;
        shutterLabel.textContent = 'tap to start';
        goToReview();
      });
    } else {
      runSession();
    }
  });

  reviewJumpBtn.addEventListener('click', goToReview);
  backToCamBtn.addEventListener('click', goToCamera);
  newSessionBtn.addEventListener('click', function(){
    state.shots = [null, null, null, null];
    Array.prototype.forEach.call(frameList.children, function(t){ t.style.backgroundImage = ''; });
    updateReviewJump();
    drawStrip();
    goToCamera();
  });

  /* retake a single frame from the review screen */
  Array.prototype.forEach.call(frameList.children, function(thumb, i){
    thumb.addEventListener('click', function(){
      state.retakeIndex = i;
      shutterLabel.textContent = 'retake shot ' + (i + 1);
      goToCamera();
    });
  });

  function goToReview(){
    document.body.classList.add('mode-review');
    drawStrip();
  }
  function goToCamera(){
    document.body.classList.remove('mode-review');
  }

  /* ================= edit sheet ================= */
  function syncWordmarkPreview(){
    wordmarkPreview.textContent = brandInput.value || 'chani._.wu';
  }
  brandChipBtn.addEventListener('click', function(){ document.body.classList.add('sheet-open'); });
  sheetDoneBtn.addEventListener('click', function(){ document.body.classList.remove('sheet-open'); });
  sheetBackdrop.addEventListener('click', function(e){
    if (e.target === sheetBackdrop) document.body.classList.remove('sheet-open');
  });
  brandInput.addEventListener('input', function(){ syncWordmarkPreview(); drawStrip(); });
  captionInput.addEventListener('input', drawStrip);

  /* ================= strip rendering ================= */
  function drawWordmark(ctx, text, cx, cy, size){
    ctx.save();
    ctx.font = '800 ' + size + 'px "Baloo 2", sans-serif';
    ctx.textBaseline = 'middle';
    var widths = text.split('').map(function(ch){ return ctx.measureText(ch).width; });
    var total = widths.reduce(function(a,b){ return a + b; }, 0);
    var x = cx - total / 2;
    text.split('').forEach(function(ch, i){
      ctx.fillStyle = LETTER_COLORS[i % LETTER_COLORS.length];
      ctx.fillText(ch, x, cy);
      x += widths[i];
    });
    ctx.restore();
  }

  function wrapCenteredText(ctx, text, cx, cy, maxWidth, lineHeight){
    var words = text.split(' ');
    var lines = [];
    var line = '';
    words.forEach(function(w){
      var test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxWidth && line){
        lines.push(line);
        line = w;
      } else {
        line = test;
      }
    });
    if (line) lines.push(line);
    var startY = cy - ((lines.length - 1) * lineHeight) / 2;
    lines.forEach(function(l, i){ ctx.fillText(l, cx, startY + i * lineHeight); });
  }

  function drawStrip(){
    stripCtx.fillStyle = '#0a0908';
    stripCtx.fillRect(0, 0, STRIP_W, STRIP_H);

    var brand = (brandInput.value || 'chani._.wu').trim() || 'chani._.wu';
    drawWordmark(stripCtx, brand, STRIP_W / 2, HEADER_H / 2 + 6, 46);

    for (var i = 0; i < 4; i++){
      var y = HEADER_H + i * (FRAME_H + GUTTER);
      var x = MARGIN + LABEL_W;

      stripCtx.save();
      stripCtx.font = '500 13px "JetBrains Mono", monospace';
      stripCtx.fillStyle = 'rgba(237,230,220,.55)';
      stripCtx.translate(MARGIN - 4, y + FRAME_H / 2);
      stripCtx.rotate(-Math.PI / 2);
      var lbl = (i === 1 || i === 2 ? '\u25B2 ' : '') + FRAME_LABELS[i];
      stripCtx.fillText(lbl, -20, 4);
      stripCtx.restore();

      stripCtx.fillStyle = '#100d0c';
      stripCtx.fillRect(x, y, FRAME_W, FRAME_H);

      var shot = state.shots[i];
      if (shot && shot.img && shot.img.complete && shot.img.naturalWidth){
        stripCtx.drawImage(shot.img, x, y, FRAME_W, FRAME_H);
      } else {
        stripCtx.fillStyle = 'rgba(237,230,220,.18)';
        stripCtx.font = '500 14px "Space Grotesk", sans-serif';
        stripCtx.textAlign = 'center';
        stripCtx.fillText('frame ' + (i + 1), x + FRAME_W / 2, y + FRAME_H / 2);
        stripCtx.textAlign = 'left';
      }

      stripCtx.strokeStyle = 'rgba(237,230,220,.14)';
      stripCtx.lineWidth = 1;
      stripCtx.strokeRect(x + .5, y + .5, FRAME_W - 1, FRAME_H - 1);
    }

    var caption = (captionInput.value || '').trim();
    if (caption){
      stripCtx.save();
      stripCtx.font = '600 22px "Space Grotesk", sans-serif';
      stripCtx.fillStyle = 'rgba(237,230,220,.92)';
      stripCtx.textAlign = 'center';
      wrapCenteredText(stripCtx, caption, STRIP_W / 2, STRIP_H - FOOTER_H / 2, STRIP_W - MARGIN * 2, 28);
      stripCtx.restore();
    }
  }

  /* ================= share / print ================= */
  function shareStrip(){
    drawStrip();
    stripCanvas.toBlob(function(blob){
      if (!blob) return;
      var brand = (brandInput.value || 'booth').trim() || 'booth';
      var file = new File([blob], brand + '-strip.png', { type:'image/png' });
      if (navigator.canShare && navigator.canShare({ files:[file] })){
        navigator.share({ files:[file], title: brand + ' photo strip' }).catch(function(){ /* cancelled */ });
      } else {
        // fallback for browsers without file-sharing: open the image so it
        // can be long-pressed and saved manually
        var url = URL.createObjectURL(blob);
        window.open(url, '_blank');
      }
    }, 'image/png');
  }

  function printStrip(){
    drawStrip();
    printImg.src = stripCanvas.toDataURL('image/png');
    window.print();
  }

  shareBtn.addEventListener('click', shareStrip);
  printBtn.addEventListener('click', printStrip);

  /* the Web Share API (with file support) is common on iOS/Android but
     usually absent on desktop browsers, so tell people what will actually
     happen when they tap Share */
  (function setShareNote(){
    var canShareFiles = !!(navigator.canShare && navigator.canShare({ files: [new File([], 'test.png', { type: 'image/png' })] }));
    shareNote.textContent = canShareFiles
      ? 'Share opens your device\'s share sheet.'
      : 'Share opens the strip in a new tab — long-press or right-click to save it.';
  })();

  /* ================= home-screen icon ================= */
  (function makeIcon(){
    var c = document.createElement('canvas');
    c.width = 180; c.height = 180;
    var ctx = c.getContext('2d');
    ctx.fillStyle = '#171412';
    ctx.fillRect(0, 0, 180, 180);
    ctx.fillStyle = '#d9a441';
    ctx.beginPath();
    ctx.arc(90, 90, 46, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#171412';
    ctx.beginPath();
    ctx.arc(90, 90, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#b23a2e';
    ctx.fillRect(58, 46, 64, 14);
    var dataUrl = c.toDataURL('image/png');

    var appleLink = document.createElement('link');
    appleLink.rel = 'apple-touch-icon';
    appleLink.href = dataUrl;
    document.head.appendChild(appleLink);

    var iconLink = document.createElement('link');
    iconLink.rel = 'icon';
    iconLink.href = dataUrl;
    document.head.appendChild(iconLink);
  })();

  /* ================= init ================= */
  syncWordmarkPreview();
  drawStrip();

})();
</script>
</body>
</html>
